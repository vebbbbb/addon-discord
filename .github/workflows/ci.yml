name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # publishing a release on github.com (Releases > Draft a new release) builds and attaches
  # NAVTOK.exe + the addon zip to it
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install luajit
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Addon tests (luajit)
        run: luajit addon/tests/run.lua
      - name: Barcode fixture is up to date
        run: |
          luajit addon/tests/gen_fixture.lua
          git diff --exit-code addon/tests/fixtures
      - name: Go vet (linux + windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Go tests
        run: go test -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_GUILD_WEBHOOK: ${{ secrets.NAVTOK_DEFAULT_WEBHOOK != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"; else echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - name: Build NAVTOK.exe and addon zip
        run: ./scripts/build.sh "${{ steps.v.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: navtok-${{ steps.v.outputs.version }}
          path: dist/*
      # Private guild build: the webhook is baked in, so members are asked nothing.
      # Never attached to the public release - workflow artifact only.
      - name: Guild build (default webhook from secret)
        if: env.HAS_GUILD_WEBHOOK == 'true'
        env:
          NAVTOK_DEFAULT_WEBHOOK: ${{ secrets.NAVTOK_DEFAULT_WEBHOOK }}
        run: |
          mkdir -p dist-guild
          NAVTOK_OUT=dist-guild ./scripts/build.sh "${{ steps.v.outputs.version }}"
      - uses: actions/upload-artifact@v4
        if: env.HAS_GUILD_WEBHOOK == 'true'
        with:
          name: navtok-guild-${{ steps.v.outputs.version }}
          path: |
            dist-guild/NAVTOK.exe
            dist-guild/navtok-linux-amd64
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: navtok-v*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NAVTOK.exe
            dist/navtok-linux-amd64
            dist/NavtokDiscord-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
      # Announce the release in Discord. Needs the repository secret DISCORD_RELEASE_WEBHOOK
      # (a webhook of the channel to post in). Runs only for releases published on github.com,
      # so each release is announced once.
      - name: Announce on Discord
        if: github.event_name == 'release' && env.HAS_RELEASE_WEBHOOK == 'true'
        env:
          RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          NOTES: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
          REPO: ${{ github.repository }}
        run: |
          RELEASE_WEBHOOK=$(printf '%s' "$RELEASE_WEBHOOK" | tr -d '[:space:]')
          if [[ ! "$RELEASE_WEBHOOK" =~ ^https://(canary\.|ptb\.)?discord(app)?\.com/api(/v[0-9]+)?/webhooks/[0-9]+/[A-Za-z0-9_-]+$ ]]; then
            echo "::error::DISCORD_RELEASE_WEBHOOK is not a Discord webhook link. It must look like https://discord.com/api/webhooks/<id>/<token> (Discord: channel settings > Integrations > Webhooks > Copy Webhook URL)."
            exit 1
          fi
          jq -n --arg tag "$TAG" --arg name "$NAME" --arg notes "$NOTES" --arg url "$URL" \
                --arg dl "https://github.com/$REPO/releases/download/$TAG" '
            ($notes | if length > 3000 then .[0:3000] + "..." else . end) as $n |
            {
              allowed_mentions: { parse: [] },
              embeds: [{
                title: ("NAVTOK " + $tag + " is out" + (if $name != "" and $name != $tag then ": " + $name else "" end)),
                url: $url,
                color: 5793266,
                description: ((if $n != "" then $n + "\n\n" else "" end) +
                  "**Already installed?** Right-click the NAVTOK tray icon -> **Check for updates**, then type `/reload` in WoW.\n" +
                  "**Linux:** run `navtok --update`.\n" +
                  "**New here?** Download [NAVTOK.exe](" + $dl + "/NAVTOK.exe) (Windows) or [navtok-linux-amd64](" + $dl + "/navtok-linux-amd64) and run it once."),
                footer: { text: "NAVTOK DISCORD" }
              }]
            }' > payload.json
          # ?wait=true makes Discord answer with the created message; anything else is a failure
          answer=$(curl -fsS -H "Content-Type: application/json" -d @payload.json "$RELEASE_WEBHOOK?wait=true")
          if ! echo "$answer" | jq -e '.id' > /dev/null 2>&1; then
            echo "::error::Discord did not accept the announcement: ${answer:0:300}"
            exit 1
          fi
          echo "Announced in Discord (message $(echo "$answer" | jq -r .id))"
